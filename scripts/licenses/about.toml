# Shared cargo-about policy for Rust binaries shipped by this repository.
# Each packaging script supplies the exact package manifest and feature set for
# the artifact it is staging; do not generate one workspace-wide notice because
# that would include crates which are not present in the distributed binary.

targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
private = { ignore = true }

# For dual/OR expressions cargo-about picks the first accepted match, so
# copyleft alternatives (GPL-2.0, LGPL-2.1, BlueOak) are intentionally omitted.
accepted = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # tiny-keccak is pulled transitively by the optional official DeepFilterNet3
    # runtime. CC0-1.0 is a public-domain dedication and is safe to reproduce in
    # the generated notice for an explicitly requested DFN3 distribution.
    "CC0-1.0",
    # MPL-2.0 is accepted ONLY to emit the required notice for audio_thread_priority
    # (pulled transitively, unmodified, via cpal's `realtime` feature). cargo-about
    # has no per-crate accept, so this is global here; the actual policy gate keeps
    # it crate-scoped in deny.toml `exceptions`. Do not treat this as blanket
    # approval for new MPL-2.0 deps — add those to deny.toml exceptions first.
    "MPL-2.0",
]
