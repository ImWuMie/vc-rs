# vc-rs VST3 plugin configuration — OPTIONAL headless seed.
#
# The plugin normally gets its models from the GUI (Browse buttons) and stores
# them in the project's plugin state. This file only SEEDS a fresh instance that
# has no saved settings yet; once a project has its own settings, this file is
# ignored. It is handy for automation / first-run defaults.
#
# Copy this file to one of the locations the plugin searches, in order:
#   1. the path in the VC_RS_VST3_CONFIG environment variable
#   2. <os-config-dir>/vc-rs/vst3.toml
#      (%APPDATA% on Windows, $XDG_CONFIG_HOME or ~/.config elsewhere)
#   3. vc-rs-vst3.toml in the host's working directory
#
# All fields are optional; omitted fields fall back to the defaults shown here
# (which match the CLI `run` defaults). The three model paths are required for
# conversion — if any is missing the plugin loads but stays silent.
# Use absolute paths. In TOML "double-quoted" strings a backslash is an escape
# character, so a Windows path like "C:\Users\..." fails to parse ("\U...").
# Use forward slashes ("C:/Users/...") — they work on every platform — or a
# single-quoted 'literal' string, or doubled backslashes "C:\\Users\\...".

# --- Models (required for conversion) ---
model = "/path/to/models/rvc/your_model.onnx"
embedder = "/path/to/models/hubert/contentvec.onnx"
f0_model = "/path/to/models/rmvpe/rmvpe.onnx"
# Optional: RVC retrieval index. Use an `added_IVF*_Flat_*.index` matching
# the generator feature width (v1 = 256, v2 = 768), not a `trained_*.index`.
# index_path = "/path/to/models/rvc/added_IVF256_Flat_nprobe_1.index"

# --- Input denoiser (optional) ---
# The VST3 worker supports off, noise-gate, rnnoise, webrtc, and
# deep-filter-net3 when the matching package feature is built. Models remain
# external; a package built without an optional feature reports a load error.
denoiser = "off"
webrtc_suppression_level = "moderate" # low | moderate | high | very-high
# deepfilternet3_model = "/path/to/DeepFilterNet3_onnx.tar.gz"
dfn3_attenuation_limit_db = 18.0
dfn3_post_filter_beta = 0.0

# Optional: explicit embedder output tensor name.
# embedder_output = "output"

# --- Backend ---
# "cpu" | "windowsml" | "windowsml-directml" | "windowsml-cpu" | "cuda" | "tensorrt"
# Explicit Windows ML catalog EPs are also valid: "windowsml-nvtrtx",
# "windowsml-qnn", "windowsml-openvino", "windowsml-migraphx", "windowsml-vitisai".
provider = "windowsml"
# "high" | "normal". Applied only by the native TensorRT backend.
gpu_priority = "high"
# CUDA device ID used by CUDA and TensorRT providers.
gpu_device_id = 0

# Pitch, Speaker, Input Gain and Output Gain are NOT set here: they are DAW
# parameters (the host saves/restores them per project and they are
# automatable). Set them from the plugin's controls in your DAW.
# Index Rate, Protect, and Protect Transition are also DAW parameters. Index
# Rate = 0 disables retrieval; Protect defaults to 0.33 and 0.5 disables
# unvoiced-frame protection. Protect Transition defaults to 0 ms (stock RVC);
# try 20 ms to ease retrieved-feature boundaries around consonants.
# Denoiser -> ContentVec is also a DAW parameter. It defaults to 0.25, keeping
# raw articulation while mixing a quarter of the denoised signal into ContentVec;
# Denoiser -> RMVPE is a separate DAW parameter and defaults to 1.0 (fully
# denoised). Set it to 0.0 to feed RMVPE the aligned raw input instead.

# --- Detection thresholds ---
f0_threshold = 0.03
f0_continuity = true
silence_threshold = 0.0001

# --- Latency / chunking (milliseconds) ---
chunk_ms = 500             # larger = more context + more latency
crossfade_ms = 85
sola_search_ms = 12
rvc_output_tail_discard_ms = 10
extra_convert_ms = 100
smoother = "sola"          # "sola" | "psola"

# --- Volume handling ---
volume_envelope = false
rms_mix_rate = 0.0
auto_output_gain = false
target_output_rms = 0.03
max_output_gain = 512.0
